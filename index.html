<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIP OR DIE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: #000;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #111;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #c8ff00;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: #c8ff00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 900;
            font-size: 16px;
        }

        /* Hero Section */
        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px 80px;
            position: relative;
            background: radial-gradient(ellipse at center, #0a1a00 0%, #000000 70%);
        }

        .coin-container {
            margin-bottom: 50px;
            perspective: 1000px;
        }

        .coin {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1a1a1a, #000);
            border: 3px solid #c8ff00;
            box-shadow: 
                0 0 40px rgba(200, 255, 0, 0.25),
                inset 0 0 30px rgba(200, 255, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: float 4s ease-in-out infinite;
        }

        .coin::before {
            content: "F";
            font-size: 120px;
            color: #c8ff00;
            text-shadow: 0 0 20px rgba(200, 255, 0, 0.6);
            font-weight: 900;
            line-height: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-15px) rotateY(15deg); }
        }

        .small-text {
            font-size: 13px;
            letter-spacing: 3px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(36px, 8vw, 56px);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .description {
            max-width: 480px;
            color: #999;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .live-badge {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 35px;
            color: #fff;
        }

        .btn {
            display: inline-block;
            padding: 16px 48px;
            background: transparent;
            border: 2px solid #c8ff00;
            color: #c8ff00;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 40px;
        }

        .btn:hover {
            background: #c8ff00;
            color: #000;
            box-shadow: 0 0 30px rgba(200, 255, 0, 0.4);
        }

        /* Contract Address */
        .ca-box {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 14px 20px;
            max-width: 520px;
            width: 100%;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ca-label {
            font-size: 12px;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ca-address {
            color: #c8ff00;
            font-size: 14px;
            word-break: break-all;
            text-decoration: none;
            transition: color 0.2s;
        }

        .ca-address:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Footer links */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 28px;
            font-size: 15px;
            margin-top: 10px;
        }

        .footer-links a {
            color: #c8ff00;
            text-decoration: none;
            opacity: 0.85;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-links a:hover {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .coin {
                width: 180px;
                height: 180px;
            }
            .coin::before {
                font-size: 100px;
            }
            .live-badge {
                font-size: 22px;
            }
            .ca-address {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">F</div>
            FLIP OR DIE
        </div>
    </div>

    <!-- Hero -->
    <section class="hero">
        <div class="coin-container">
            <div class="coin"></div>
        </div>

        <div class="small-text">ARE YOU READY TO FLIP?</div>
        
        <h1>Which side are<br>you on?</h1>
        
        <p class="description">
            Nobody carries coins anymore. Here is one that lives on-chain: pick Bitcoin or Ether, flip, and set your bets.
        </p>

        <div class="live-badge">$FOD IS LIVE</div>

        <a href="#" class="btn">$FOD IT!</a>

        <!-- Contract Address (klikable) -->
        <div class="ca-box">
            <div class="ca-label">Contract Address</div>
            <a 
                href="https://etherscan.io/address/0x50Ba557d1FDc846F48DA5Ae2B5D51A8ee05Aa245" 
                target="_blank" 
                class="ca-address"
            >
                0xDef8274116A4Fba373a9139233caFaA87Ca31111
            </a>
        </div>

        <!-- Social Links -->
        <div class="footer-links">
            <a href="https://x.com/fodtorch" target="_blank">
                𝕏 @fodtorch
            </a>
            <a href="#">Terms & conditions</a>
        </div>
    </section>

</body>
</html>
